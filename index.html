<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Günün Mübarək Ana ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff7eb3,#ff758c,#ffb199);
color:white;
text-align:center;
overflow-x:hidden;
}

.container{
padding:40px 20px;
}

h1{
font-size:42px;
animation:fade 2s;
}

p{
font-size:22px;
max-width:700px;
margin:auto;
line-height:1.6;
}

img{
width:250px;
border-radius:20px;
margin-top:30px;
box-shadow:0 0 20px rgba(255,255,255,.4);
}

button{
margin-top:30px;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:30px;
background:white;
color:#ff4081;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

@keyframes fade{
from{opacity:0;transform:translateY(-30px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<h1>🎂 Ad Günün Mübarək Ana ❤️</h1>

<p>
Canım anam...
Sən mənim üçün dünyanın ən dəyərli insanısan.
Həmişə yanımda olduğun üçün sənə sonsuz təşəkkür edirəm.
Allah səni qorusun.
Səni çox sevirəm. ❤️
</p>

<img src="https://picsum.photos/400/500" alt="Şəkil">

<br>

<button onclick="alert('Səni çox sevirəm Ana ❤️')">
Mənə Bas ❤️
</button>

</div>

</body>
  </html>
