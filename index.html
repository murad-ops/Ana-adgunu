body{

.envelope{

height:170px;

}

.envelope:hover{
transform:scale(1.05);
}

.flap{
position:absolute;
top:0;
left:0;
width:0;
height:0;
border-left:130px solid transparent;
border-right:130px solid transparent;
border-top:90px solid #ff89bf;
transform-origin:top;
transition:1s;
}

.letter{
position:absolute;
width:92%;
height:95%;
left:4%;
bottom:5%;
background:white;
border-radius:10px;
padding:15px;
overflow:auto;

transition:1s;

}
.letter img{
width:170px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 0 15px pink;
}

.letter h2{
color:#ff2f7d;
margin-bottom:10px;
}

.letter p{
font-size:18px;
line-height:1.7;
color:#444;
font-weight:bold;
}

.show .flap{
transform:rotateX(180deg);
}

.show .letter{
transform:translateY(-15px);
}
